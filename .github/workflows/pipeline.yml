name: Pipeline

on:
  push:
    branches:
      - main
  pull_request: {}

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pre-commit
        run: python -m pip install --upgrade pip && pip install pre-commit
      - name: Run pre-commit (ruff)
        run: pre-commit run --all-files

  black:
    needs: [ruff]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: psf/black@stable
        with:
          options: "--check --diff"
          src: "./"

  mypy:
    needs: [black]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install mypy
        run: python -m pip install --upgrade pip && pip install mypy
      - name: Run mypy
        run: mypy --ignore-missing-imports pyiron_nodes

  minimal:
    needs: [black]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.13"
          miniforge-version: latest
          channels: conda-forge
          conda-remove-defaults: "true"
          environment-file: .ci_support/environment-mini.yml
      - name: Install
        shell: bash -l {0}
        run: |
          pip install . --no-deps --no-build-isolation
      - name: Test
        shell: bash -l {0}
        run: |
          python -m unittest discover pyiron_nodes/tests

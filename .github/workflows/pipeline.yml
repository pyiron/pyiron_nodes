name: Pipeline

on:
  push:
    branches:
      - main
  pull_request: {}

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff
        run: python -m pip install --upgrade pip && pip install ruff
      - name: Run ruff (non-mutating)
        run: ruff check --config .ruff.toml .

  black:
    # needs: [ruff]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: psf/black@stable
        with:
          options: "--check --diff --line-length 88"
          src: "./"

  black_fix:  # in most cases pre-commit is faster
    needs: [black]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the PR head so we can commit back to the branch
          token: ${{ secrets.DEPENDABOT_WORKFLOW_TOKEN }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: format black
        uses: psf/black@stable
        with:
          options: "--line-length 88"
          src: "./"
      - name: commit
        run: |
          git config --local user.email "pyiron@mpie.de"
          git config --local user.name "pyiron-runner"
          git commit -m "Format black" -a || echo "Nothing to commit"
      - name: push
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.DEPENDABOT_WORKFLOW_TOKEN }}
          branch: ${{ github.event.pull_request.head.ref }}

  mypy:
    needs: [black]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install mypy
        run: python -m pip install --upgrade pip && pip install mypy
      - name: Run mypy
        run: mypy --config-file mypy.ini .

  minimal:
    needs: [black]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.12"
          miniforge-version: latest
          channels: conda-forge
          conda-remove-defaults: "true"
          environment-file: .ci_support/environment-mini.yml
      - name: Install
        shell: bash -l {0}
        run: |
          pip install . --no-deps --no-build-isolation
      - name: Test
        shell: bash -l {0}
        run: |
          python -m unittest discover tests

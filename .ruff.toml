exclude = [
    ".ci_support",
    "docs",
    "notebooks",
]

[lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "I",   # isort
    "C4",  # flake8-comprehensions
    "ERA", # eradicate
    "PL",  # pylint
]
ignore = [
    "E402",   # module-level import not at top of file
    "E501",   # line length handled by formatter
    "PLC0415",# import should be at top-level (pylint rule)
    "PLR0913",# too many arguments
    "PLR2004",# magic values in comparisons
    "PLR0912",# too many branches
]
